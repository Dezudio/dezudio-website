name: Build Test Site

on:
  push:
    branches:
      - main
  pull_request:

# Publishing to gh-pages pushes to this repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # Superseded pull request builds can be dropped; a push to main is
      # publishing the test site, so let it finish.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Pull requests stop at the build: it only has to prove the site
      # compiles. Netlify publishes their previews.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: test.dezudio.com
