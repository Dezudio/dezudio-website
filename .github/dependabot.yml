version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # react and react-dom must stay on the same version, including
      # across major releases.
      react:
        patterns:
          - react
          - react-dom
      # One PR for all non-breaking bumps instead of one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for all action updates, like the npm ones.
      actions:
        patterns:
          - '*'
